<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body {
    width: 280px; margin: 0; padding: 14px;
    font: 13px/1.6 "Microsoft YaHei", system-ui, sans-serif;
  }
  h1 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
  #status {
    font-size: 12px; padding: 7px 9px; border-radius: 6px;
    background: rgba(128,128,128,.14); margin-bottom: 12px; word-break: break-all;
  }
  #status.ok { background: rgba(46,160,67,.16); }
  #status.err { background: rgba(207,60,60,.16); }
  #root { display: block; margin-top: 4px; opacity: .75; }
  button.primary {
    width: 100%; padding: 10px; font-size: 13px; font-weight: 600;
    border: 0; border-radius: 7px; background: #2f6fed; color: #fff; cursor: pointer;
  }
  button.primary:hover { background: #265ecb; }
  button.primary:disabled { background: #8a97ad; cursor: default; }
  button.sec {
    width: 100%; padding: 8px; font-size: 12.5px; margin-bottom: 10px;
    border: 1px solid #2f6fed; border-radius: 7px; background: #fff;
    color: #2f6fed; cursor: pointer;
  }
  button.sec:hover { background: #eef2fb; }
  button.sec:disabled { opacity: .55; cursor: default; }
  .opts { margin: 12px 0 4px; }
  .opts label { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; cursor: pointer; }
  .hint { font-size: 11.5px; opacity: .7; margin-top: 10px; }
  kbd {
    font: 11px ui-monospace, monospace; padding: 1px 4px; border-radius: 3px;
    background: rgba(128,128,128,.2);
  }
  a { color: #2f6fed; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
  <h1>AI 回答存档</h1>
  <div id="status">正在检查本机服务…</div>

  <button class="sec" id="startSrv" hidden>启动本机服务</button>

  <button class="primary" id="pick" disabled>选择要存档的回答</button>

  <div class="opts">
    <label><input type="checkbox" id="saveMd" checked> 同时保存 Markdown 文字版</label>
    <label><input type="checkbox" id="openAfter"> 保存后自动打开文件夹</label>
  </div>

  <div class="hint">
    点按钮后鼠标移到 AI 回答上，单击选中；<br>
    面板里可以调整截取范围，也能用 <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> 直接开始。
  </div>

  <div style="margin-top:10px"><a id="openRoot">打开存档文件夹</a></div>

  <script src="popup.js"></script>
</body>
</html>
